[project]
name = "arena-bot"
version = "0.1.0"
description = "Arena Hero 自动游玩机器人（uv 管理）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arena-hero>=0.2.6,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv]
package = true
