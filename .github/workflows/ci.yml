name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Go checks, tests, contracts and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run full gate
        run: bash scripts/go-check.sh

  docker:
    name: Build and push release image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main or version tag push only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          TAGS="ghcr.io/deliciousbuding/arena:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,ghcr.io/deliciousbuding/arena:main"
          fi
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            TAGS="$TAGS,ghcr.io/deliciousbuding/arena:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test binary (version, uid, static)
        run: |
          docker run --rm --entrypoint /app/arena ghcr.io/deliciousbuding/arena:${{ github.sha }} version
          docker run --rm --entrypoint /app/arena ghcr.io/deliciousbuding/arena:${{ github.sha }} 2>&1 | grep -q "usage: arena" || exit 1
