name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: TS (check + test + schema drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run schema:check

  py:
    name: Docs/status drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync
      - run: uv run python scripts/gen-status.py --check
      - run: uv run python scripts/docs_health.py --check
