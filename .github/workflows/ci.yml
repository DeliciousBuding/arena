name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Check, test, contracts and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run schema:check
      - run: npm run replay:ts
      - run: npm run server:check
      - run: python scripts/gen-status.py --check
      - run: python scripts/docs_health.py --check

  docker:
    name: Build and push release image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: true
          tags: |
            ghcr.io/deliciousbuding/arena:${{ github.sha }}
            ghcr.io/deliciousbuding/arena:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image contents (tsx, runner, uid, no secrets)
        run: |
          docker run --rm --entrypoint node ghcr.io/deliciousbuding/arena:${{ github.sha }} -e "const fs=require('fs'); if(!fs.existsSync('/app/node_modules/.bin/tsx')) process.exit(1); if(!fs.existsSync('/app/scripts/server/run-supervisor.sh')) process.exit(1); if(process.getuid()!==1001) process.exit(1); console.log('image ok', process.version)"
