name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Check, test, contracts and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run schema:check
      - run: npm run replay:ts
      - run: npm run server:check
      - run: python scripts/gen-status.py --check
      - run: python scripts/docs_health.py --check
