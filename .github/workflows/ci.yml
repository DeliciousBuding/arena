name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: TS (check + test + schema drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run schema:check

  py:
    name: Python (pytest + status drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync
      - run: uv run pytest tests/ -q
      - run: uv run python scripts/gen-status.py --check

  replay:
    name: W3 replay (Python/TS parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync
      - run: npm ci
      - run: npm run replay:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-differential-report
          path: /tmp/w3-report.txt
