name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Check, test, contracts and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run schema:check
      - run: npm run replay:ts
      - run: npm run server:check
      - run: python scripts/gen-status.py --check
      - run: python scripts/docs_health.py --check

  docker:
    name: Build and push release image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (main or version tag push only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          TAGS="ghcr.io/deliciousbuding/arena:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,ghcr.io/deliciousbuding/arena:main"
          fi
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            TAGS="$TAGS,ghcr.io/deliciousbuding/arena:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image contents (tsx, entrypoint, uid, no secrets)
        run: |
          docker run --rm --entrypoint node ghcr.io/deliciousbuding/arena:${{ github.sha }} -e "const fs=require('fs'); if(!fs.existsSync('/app/node_modules/.bin/tsx')) process.exit(1); if(!fs.existsSync('/app/packages/arena-agent/src/cli/run-supervisor.ts')) process.exit(1); if(process.getuid()!==1001) process.exit(1); console.log('image ok', process.version)"
      - name: Smoke-test native entrypoint (ARENA_SERVICE_MODE wiring)
        run: |
          docker run --rm ghcr.io/deliciousbuding/arena:${{ github.sha }} 2>&1 | head -3 | grep -qE "run-supervisor 失败|missing|usage" || true
          docker run --rm --env ARENA_SERVICE_MODE=shadow --env ARENA_CONFIGS=t1 --env ARENA_CONFIG_DIR=/nonexistent --env ARENA_RUNTIME_DIR=/tmp ghcr.io/deliciousbuding/arena:${{ github.sha }} 2>&1 | head -3
