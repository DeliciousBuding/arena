# legacy：LLM 逐 Tick 直控已被 #8 裁决否决（冷启动 22.8s ≫ 14s 窗口）。
# 保留仅作数据收集参考；新策略走 TS 编排层，见 experiments/README.md。
name: exp-llm-4
description: 4 账号 LLM 并发 — 每账号独立 pi RPC 进程/会话，策略变体对比（economic/aggressive/standard/standard）
tenants:
  - api_key_index: 0
    name: t1
    strategy: llm
    params:
      accumulate_target: 30
      guard_resources: 20
      guard_force: 4
      llm_rules: economic
      llm_timeout: 10.0
      llm_retries: 0
      llm_session_dir: logs/pi_rpc_sessions_t1
  - api_key_index: 1
    name: t2
    strategy: llm
    params:
      accumulate_target: 30
      guard_resources: 20
      guard_force: 4
      llm_rules: aggressive
      llm_timeout: 10.0
      llm_retries: 0
      llm_session_dir: logs/pi_rpc_sessions_t2
  - api_key_index: 2
    name: t3
    strategy: llm
    params:
      accumulate_target: 30
      guard_resources: 20
      guard_force: 4
      llm_rules: standard
      llm_timeout: 10.0
      llm_retries: 0
      llm_session_dir: logs/pi_rpc_sessions_t3
  - api_key_index: 3
    name: t4
    strategy: llm
    params:
      accumulate_target: 30
      guard_resources: 20
      guard_force: 4
      llm_rules: standard
      llm_timeout: 10.0
      llm_retries: 0
      llm_session_dir: logs/pi_rpc_sessions_t4
