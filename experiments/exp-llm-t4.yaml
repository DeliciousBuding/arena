name: exp-llm-t4
description: t4（deliciousbuding）LLM 真机首战 — pi RPC + arena_plan 原生工具 + 确定性兜底
tenants:
  - api_key_index: 3
    name: t4
    strategy: llm
    params:
      accumulate_target: 30
      guard_resources: 20
      guard_force: 4
      llm_timeout: 10.0     # 15s 窗口内留提交余量；超时本 tick 回退 balance
      llm_retries: 0        # 窗口内不重试（会烧掉提交窗口）；tick 级天然重试
      llm_session_dir: logs/pi_rpc_sessions_t4  # 独立会话，不混离线验证历史
