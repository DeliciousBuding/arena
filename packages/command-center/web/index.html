<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050607" />
  <meta name="description" content="Arena 指挥面板 · React 前端：4 租户全局联盟测绘地图 + 资源展示 + 实时决策流" />
  <title>Arena 指挥面板 · React</title>
  <link rel="icon" href="/assets/game/units/core.png" type="image/png" />
  <script>
    // 主题首载（避免闪烁）：在 React 挂载前读 localStorage 设 data-theme
    try { document.documentElement.dataset.theme = localStorage.getItem("arena-cc.theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
